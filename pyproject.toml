[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudiscope"
version = "0.1.7"
description = "Let Claude drive a SCPI oscilloscope over an MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyvisa>=1.14",
    "mcp>=1.2,<2",   # pinned: 2.x renamed FastMCP; revisit when porting
]

[project.scripts]
claudiscope = "claudiscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]